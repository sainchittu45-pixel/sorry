<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sirf Tumhare Liye Ek Paighaam 💌</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --primary-pink: #ff3377;
    --accent-gold: #ffd166;
    --soft-glow: rgba(255, 51, 119, 0.45);
    --glass-bg: rgba(25, 12, 38, 0.65);
    --glass-border: rgba(255, 255, 255, 0.22);
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Outfit', sans-serif;
    background: #08020e;
    color: #ffffff;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 20px 14px 40px;
    perspective: 1200px;
    user-select: none;
    position: relative;
}

/* Background Canvas */
#bg-canvas, #fx-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
}
#bg-canvas { z-index: 1; }
#fx-canvas { z-index: 50; }

/* Aurora Ambient Gradient Layer */
.aurora-bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 15% 20%, rgba(138, 43, 226, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(255, 51, 119, 0.35) 0%, transparent 48%),
                radial-gradient(circle at 50% 50%, rgba(255, 209, 102, 0.12) 0%, transparent 60%);
    filter: blur(55px);
    z-index: 0;
    pointer-events: none;
    animation: auroraDrift 14s ease-in-out infinite alternate;
}

@keyframes auroraDrift {
    0% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.12) rotate(6deg); }
}

/* Audio Toggle Button */
.audio-toggle {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 100;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 40px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffd166;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
}
.audio-toggle:hover {
    background: rgba(255, 255, 255, 0.16);
    transform: translateY(-2px);
}
.audio-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ffaa;
    box-shadow: 0 0 8px #00ffaa;
    transition: 0.3s;
}
.audio-indicator.muted {
    background: #888;
    box-shadow: none;
}

/* Header Text Banner */
.top-header {
    text-align: center;
    position: relative;
    z-index: 20;
    margin-bottom: 24px;
    animation: headerFade 1s ease forwards;
}
@keyframes headerFade {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

.top-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 18px;
    border-radius: 30px;
    background: rgba(255, 209, 102, 0.12);
    border: 1px solid rgba(255, 209, 102, 0.35);
    backdrop-filter: blur(8px);
    color: #ffd166;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    box-shadow: 0 0 20px rgba(255, 209, 102, 0.2);
}
.top-quote {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    color: #ffccd9;
    font-style: italic;
    letter-spacing: 0.3px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
}

/* ================= 3D ENVELOPE STAGE ================= */
.envelope-stage {
    position: relative;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.envelope-stage.opened-stage {
    opacity: 0;
    transform: scale(0.8) translateY(-40px);
    pointer-events: none;
    position: absolute;
}

.envelope-container {
    width: 320px;
    height: 220px;
    position: relative;
    background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 35px rgba(255, 51, 119, 0.25);
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.envelope-container:hover {
    transform: translateY(-6px) rotateX(4deg);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.75), 0 0 45px rgba(255, 51, 119, 0.4);
}

.envelope-pocket {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    clip-path: polygon(0% 0%, 50% 50%, 100% 0%, 100% 100%, 0% 100%);
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(25, 8, 30, 0.85));
    border-radius: 0 0 18px 18px;
    z-index: 5;
    pointer-events: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
}

.envelope-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 120px;
    clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(85, 27, 72, 0.9));
    transform-origin: top center;
    transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 6;
}

.envelope-container.open .envelope-flap {
    transform: rotateX(180deg);
    z-index: 1;
}

/* Gold Wax Seal */
.wax-seal {
    position: absolute;
    top: 96px;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffea85 0%, #d49a17 45%, #7a5405 100%);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 209, 102, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.8), inset 0 -3px 6px rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 8;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: sealPulse 2.4s infinite ease-in-out;
}
.wax-seal:hover {
    transform: translate(-50%, -50%) scale(1.1);
    box-shadow: 0 10px 30px rgba(255, 209, 102, 0.8), 0 0 35px rgba(255, 51, 119, 0.6);
}
@keyframes sealPulse {
    0%, 100% { box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 209, 102, 0.5); }
    50% { box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 32px rgba(255, 209, 102, 0.85); }
}

.wax-seal-inner {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 2px dashed rgba(255, 248, 220, 0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
    color: #fff8dc;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
}

.envelope-prompt {
    margin-top: 24px;
    font-size: 14.5px;
    color: #ffd6e7;
    letter-spacing: 0.5px;
    background: rgba(255, 255, 255, 0.08);
    padding: 8px 22px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    animation: bouncePrompt 2s infinite;
}
@keyframes bouncePrompt {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

/* ================= MAIN LETTER CARD STAGE ================= */
.letter-stage {
    display: none;
    position: relative;
    z-index: 25;
    width: 100%;
    max-width: 440px;
    opacity: 0;
    transform: translateY(50px) scale(0.92);
    transition: all 0.85s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.letter-stage.visible {
    display: block;
    opacity: 1;
    transform: translateY(0) scale(1);
}

.main-glass-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 34px 26px;
    backdrop-filter: blur(26px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(255, 51, 119, 0.22);
    position: relative;
    overflow: hidden;
    text-align: center;
}

.card-shine {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.07) 50%, transparent 60%);
    transform: rotate(30deg);
    pointer-events: none;
}

/* Top Progress Tracker (5 Chapters) */
.chapter-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
}
.chapter-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    transition: all 0.4s ease;
}
.chapter-dot.active {
    width: 32px;
    border-radius: 12px;
    background: linear-gradient(90deg, #ff3377, #ffd166);
    box-shadow: 0 0 14px rgba(255, 51, 119, 0.7);
}

/* Badge Icon Container */
.badge-halo {
    width: 78px;
    height: 78px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 51, 119, 0.22) 0%, rgba(255, 255, 255, 0.04) 75%);
    border: 1px solid rgba(255, 255, 255, 0.25);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 26px var(--soft-glow);
    cursor: pointer;
    transition: transform 0.3s;
}
.badge-halo:hover {
    transform: scale(1.1) rotate(5deg);
}
.badge-icon {
    font-size: 38px;
    filter: drop-shadow(0 3px 10px rgba(255, 51, 119, 0.6));
    animation: iconFloat 2.6s ease-in-out infinite alternate;
}
@keyframes iconFloat {
    0% { transform: translateY(0); }
    100% { transform: translateY(-6px); }
}

/* Chapter Subtitle & Title */
.chap-tag {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffd166;
    margin-bottom: 8px;
    display: inline-block;
}
.chap-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 16px;
    line-height: 1.3;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
}

/* Text Container with Typewriter Animation */
.content-area {
    min-height: 125px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
}
.letter-paragraph {
    font-size: 15.5px;
    line-height: 1.85;
    color: #f7e6ef;
    font-weight: 300;
    text-align: center;
}
.letter-paragraph strong {
    color: #ff9bbb;
    font-weight: 600;
}
.type-cursor {
    display: inline-block;
    width: 2px;
    height: 16px;
    background: #ff3377;
    margin-left: 3px;
    vertical-align: middle;
    animation: blink 0.8s infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Buttons */
.btn-primary {
    width: 100%;
    padding: 14px 24px;
    border: none;
    border-radius: 35px;
    background: linear-gradient(135deg, #ff3377 0%, #e01e5a 50%, #9b1d5c 100%);
    color: #ffffff;
    font-family: 'Outfit', sans-serif;
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 51, 119, 0.45);
    transition: all 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}
.btn-primary:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 12px 32px rgba(255, 51, 119, 0.65);
}
.btn-primary:active {
    transform: scale(0.98);
}

/* Gussa Meter (Chapter 4) */
.meter-box {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 16px 14px;
    margin: 16px 0;
}
.meter-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #ffd6e7;
    margin-bottom: 10px;
    font-weight: 500;
}
.custom-range {
    -webkit-appearance: none;
    width: 100%;
    height: 8px;
    border-radius: 5px;
    background: linear-gradient(to right, #00ffaa, #ffd166, #ff3377);
    outline: none;
    cursor: pointer;
}
.custom-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    cursor: pointer;
    border: 3px solid #ff3377;
    transition: transform 0.15s;
}
.custom-range::-webkit-slider-thumb:hover {
    transform: scale(1.2);
}
.gussa-status {
    font-size: 14px;
    font-weight: 600;
    color: #ffd166;
    margin-top: 10px;
}

/* Playful Resolution Buttons (Chapter 4) */
.playful-actions {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 14px;
    min-height: 110px;
}
.btn-forgive {
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #00b074, #00875a);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 176, 116, 0.4);
    transition: all 0.3s;
    z-index: 2;
}
.btn-forgive:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 25px rgba(0, 176, 116, 0.6);
}

.btn-runaway {
    width: 100%;
    padding: 12px 20px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.08);
    color: #ffb3c6;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
    position: relative;
}

/* Handwritten Signature */
.signature-box {
    margin-top: 20px;
    font-family: 'Dancing Script', cursive;
    font-size: 24px;
    color: #ffccd9;
    text-shadow: 0 2px 10px rgba(255, 51, 119, 0.5);
}

/* Micro Click Sparkle */
.click-heart {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    animation: clickPop 0.8s ease-out forwards;
    transform: translate(-50%, -50%);
}
@keyframes clickPop {
    0% { transform: translate(-50%, -50%) scale(0.5) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -100px) scale(1.4) rotate(25deg); opacity: 0; }
}
</style>
</head>

<body>

<!-- Moving Aurora Glow Layer -->
<div class="aurora-bg"></div>

<!-- Background Constellation Stars -->
<canvas id="bg-canvas"></canvas>

<!-- Confetti & Celebration Layer -->
<canvas id="fx-canvas"></canvas>

<!-- Top Audio Toggle -->
<div class="audio-toggle" id="audioBtn" onclick="toggleAudio()">
    <div class="audio-indicator" id="audioDot"></div>
    <span id="audioText">Melody: ON</span>
    <span>🎵</span>
</div>

<!-- ================= STAGE 1: 3D SEALED ENVELOPE ================= -->
<div class="envelope-stage" id="envelopeStage">
    
    <div class="top-header">
        <div class="top-pill">✨ Ek Chhoti Si Baat ✨</div>
        <p class="top-quote">"Bas 2 minute nikaal kar meri baat sun lena..." 🕊️</p>
    </div>

    <div class="envelope-container" id="envelopeWrapper" onclick="openEnvelope(event)">
        <!-- Envelope Flap -->
        <div class="envelope-flap" id="envelopeFlap"></div>

        <!-- Gold Wax Seal -->
        <div class="wax-seal" id="waxSeal">
            <div class="wax-seal-inner">❤️</div>
        </div>

        <!-- Envelope Pocket -->
        <div class="envelope-pocket"></div>
    </div>

    <div class="envelope-prompt">
        Tap the wax seal to open 💌
    </div>
</div>

<!-- ================= STAGE 2: MULTI-STEP LETTER CARD ================= -->
<div class="letter-stage" id="letterStage">
    <div class="main-glass-card">
        <div class="card-shine"></div>

        <!-- 5-Chapter Dots Tracker -->
        <div class="chapter-nav">
            <div class="chapter-dot active" id="dot-1"></div>
            <div class="chapter-dot" id="dot-2"></div>
            <div class="chapter-dot" id="dot-3"></div>
            <div class="chapter-dot" id="dot-4"></div>
            <div class="chapter-dot" id="dot-5"></div>
        </div>

        <!-- Glowing Badge -->
        <div class="badge-halo" onclick="handleBadgeTap(event)">
            <span class="badge-icon" id="badgeEmoji">💌</span>
        </div>

        <!-- Chapter Header -->
        <span class="chap-tag" id="chapTag">Chapter 1 / 5</span>
        <h2 class="chap-title" id="chapTitle">Really Sorry!</h2>

        <!-- Interactive Typing Content Area -->
        <div class="content-area">
            <p class="letter-paragraph" id="letterText"></p>
        </div>

        <!-- Action / Interactive Area -->
        <div id="interactiveArea">
            <button class="btn-primary" id="nextBtn" onclick="nextChapter(event)">
                <span>Ek baar meri baat sunogi? 🌸</span>
            </button>
        </div>

        <!-- Signature -->
        <div class="signature-box" id="signBox">
            Take care 🤝
        </div>
    </div>
</div>

<script>
/* ================= 1. Web Audio API Soft Chimes ================= */
let audioCtx = null;
let soundEnabled = true;

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function playHarpNote(freq, type = 'sine', duration = 0.9) {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        gain.gain.setValueAtTime(0.09, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + duration);
    } catch(e) {}
}

function playHarpChord(notes = [523.25, 659.25, 783.99, 1046.50]) {
    notes.forEach((freq, idx) => {
        setTimeout(() => playHarpNote(freq, 'sine', 1.0), idx * 80);
    });
}

function toggleAudio() {
    soundEnabled = !soundEnabled;
    const dot = document.getElementById("audioDot");
    const text = document.getElementById("audioText");
    if (soundEnabled) {
        dot.classList.remove("muted");
        text.innerText = "Melody: ON";
        playHarpNote(659.25);
    } else {
        dot.classList.add("muted");
        text.innerText = "Melody: OFF";
    }
}

/* ================= 2. Background Constellation Canvas ================= */
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let stars = [];

function resizeBg() {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeBg);
resizeBg();

class Star {
    constructor() {
        this.x = Math.random() * bgCanvas.width;
        this.y = Math.random() * bgCanvas.height;
        this.size = Math.random() * 1.8 + 0.6;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random() * 0.7 + 0.3;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0) this.x = bgCanvas.width;
        if (this.x > bgCanvas.width) this.x = 0;
        if (this.y < 0) this.y = bgCanvas.height;
        if (this.y > bgCanvas.height) this.y = 0;
    }
    draw() {
        bgCtx.fillStyle = `rgba(255, 230, 240, ${this.alpha})`;
        bgCtx.beginPath();
        bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        bgCtx.fill();
    }
}

for (let i = 0; i < 60; i++) stars.push(new Star());

function animateBg() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    for (let i = 0; i < stars.length; i++) {
        stars[i].update();
        stars[i].draw();
        for (let j = i + 1; j < stars.length; j++) {
            const dx = stars[i].x - stars[j].x;
            const dy = stars[i].y - stars[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 90) {
                bgCtx.strokeStyle = `rgba(255, 105, 180, ${0.12 * (1 - dist / 90)})`;
                bgCtx.lineWidth = 0.6;
                bgCtx.beginPath();
                bgCtx.moveTo(stars[i].x, stars[i].y);
                bgCtx.lineTo(stars[j].x, stars[j].y);
                bgCtx.stroke();
            }
        }
    }
    requestAnimationFrame(animateBg);
}
animateBg();

/* ================= 3. FX Confetti & Particle Explosion ================= */
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
let particles = [];

function resizeFx() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeFx);
resizeFx();

class ConfettiParticle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 8 + 4;
        this.speedX = (Math.random() - 0.5) * 12;
        this.speedY = (Math.random() - 0.7) * 14;
        this.gravity = 0.32;
        this.colors = ['#ff3377', '#ffd166', '#a06cd5', '#ff78ad', '#ffffff', '#00ffaa'];
        this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
        this.rotation = Math.random() * 360;
        this.rotSpeed = (Math.random() - 0.5) * 12;
        this.alpha = 1;
        this.decay = Math.random() * 0.018 + 0.012;
    }
    update() {
        this.speedY += this.gravity;
        this.x += this.speedX;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;
        this.alpha -= this.decay;
    }
    draw() {
        fxCtx.save();
        fxCtx.globalAlpha = Math.max(0, this.alpha);
        fxCtx.translate(this.x, this.y);
        fxCtx.rotate((this.rotation * Math.PI) / 180);
        fxCtx.fillStyle = this.color;
        fxCtx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.7);
        fxCtx.restore();
    }
}

function triggerBurst(x, y, count = 50) {
    for (let i = 0; i < count; i++) {
        particles.push(new ConfettiParticle(x, y));
    }
}

function animateParticles() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }
    requestAnimationFrame(animateParticles);
}
animateParticles();

/* ================= 4. Envelope Opening Sequence ================= */

function typeWriter(elementId, text, speed = 25, callback) {
    clearInterval(typeInterval);
    const container = document.getElementById(elementId);
    container.innerHTML = "";
    
    // Process markdown strong tags into html tokens
    let tokens = [];
    let isBold = false;
    let parts = text.split("**");
    
    parts.forEach((p, index) => {
        if (index % 2 === 1) {
            tokens.push({ text: p, bold: true });
        } else {
            tokens.push({ text: p, bold: false });
        }
    });

    let tokenIdx = 0;
    let charIdx = 0;
    let currentSpan = document.createElement(tokens[0].bold ? 'strong' : 'span');
    container.appendChild(currentSpan);

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';
    container.appendChild(cursor);

    typeInterval = setInterval(() => {
        if (tokenIdx >= tokens.length) {
            clearInterval(typeInterval);
            cursor.remove();
            if (callback) callback();
            return;
        }

        const currentToken = tokens[tokenIdx];
        if (charIdx < currentToken.text.length) {
            currentSpan.textContent += currentToken.text[charIdx];
            charIdx++;
            if (charIdx % 4 === 0) playHarpNote(700 + Math.random() * 200, 'sine', 0.15);
        } else {
            tokenIdx++;
            charIdx = 0;
            if (tokenIdx < tokens.length) {
                currentSpan = document.createElement(tokens[tokenIdx].bold ? 'strong' : 'span');
                container.insertBefore(currentSpan, cursor);
            }
        }
    }, speed);
}

function loadChapter(num) {
    currentChap = num;
    const data = storyData[num];

    // Update dots
    for (let i = 1; i <= 5; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (dot) dot.classList.toggle('active', i === num);
    }

    document.getElementById("chapTag").innerText = data.tag;
    document.getElementById("chapTitle").innerText = data.title;
    document.getElementById("badgeEmoji").innerText = data.emoji;

    const actionBox = document.getElementById("interactiveArea");
    const textBox = document.getElementById("letterText");

    if (data.isInteractiveGussa) {
        clearInterval(typeInterval);
        textBox.innerHTML = "Ab sach-sach batao, thoda gussa thanda hua ya abhi bhi bacha hai?";
        actionBox.innerHTML = `
            <div class="meter-box">
                <div class="meter-label">
                    <span>Shant 🙂</span>
                    <span>Thoda sa 😐</span>
                    <span>Bohot Zyada 😤</span>
                </div>
                <input type="range" class="custom-range" id="gussaRange" min="0" max="100" value="50" oninput="updateGussaLabel(this.value)">
                <div class="gussa-status" id="gussaText">Gussa Level: 50% (Chalo ab maaf bhi kardo yaar 🥺)</div>
            </div>

            <div class="playful-actions" id="actionContainer">
                <button class="btn-forgive" onclick="forgiveAction(event)">
                    <span>Chalo theek hai, maaf kiya 🤝❤️</span>
                </button>
                <button class="btn-runaway" id="runawayBtn" onmouseover="dodgeRunaway()" onclick="dodgeRunaway(event)">
                    <span>Nahi, abhi gussa hoon 😤</span>
                </button>
            </div>
        `;
    } else if (data.isEnd) {
        typeWriter("letterText", data.text, 22);
        actionBox.innerHTML = `
            <button class="btn-primary" style="margin-top: 15px;" onclick="sendLoveReply(event)">
                <span>Send a Smile 😊👍</span>
            </button>
        `;
    } else {
        typeWriter("letterText", data.text, 20);
        actionBox.innerHTML = `
            <button class="btn-primary" id="nextBtn" onclick="nextChapter(event)">
                <span>${data.btn}</span>
            </button>
        `;
    }
}

function nextChapter(e) {
    if (e) {
        const rect = e.currentTarget.getBoundingClientRect();
        triggerBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 40);
    }
    playHarpChord([523.25, 659.25, 783.99]);

    if (currentChap < 5) {
        loadChapter(currentChap + 1);
    }
}

function updateGussaLabel(val) {
    const txt = document.getElementById("gussaText");
    playHarpNote(400 + val * 4, 'sine', 0.2);
    if (val < 20) {
        txt.innerHTML = `Gussa Level: ${val}% — Bilkul chill scene hai! 🤝`;
    } else if (val < 55) {
        txt.innerHTML = `Gussa Level: ${val}% — Chalo ab maan bhi jao na yaar 🥺`;
    } else if (val < 80) {
        txt.innerHTML = `Gussa Level: ${val}% — Itna gussa accha nahi hota! 😅`;
    } else {
        txt.innerHTML = `Gussa Level: ${val}% — Arey itna gussa? Dil se sorry bola toh! 🙏`;
    }
}

/* Playful runaway button logic */
function dodgeRunaway(e) {
    if (e) e.preventDefault();
    const btn = document.getElementById("runawayBtn");
    if (!btn) return;

    playHarpNote(320, 'triangle', 0.2);

    const x = (Math.random() - 0.5) * 200;
    const y = (Math.random() - 0.5) * 120;
    btn.style.transform = `translate(${x}px, ${y}px)`;

    const playfulPhrases = [
        "Arey click nahi hoga! 😜",
        "Itna gussa mat karo yaar 🙈",
        "Chhodo ab, maaf kardo! 🤝",
        "Gussa khatam karo please! 😅"
    ];
    btn.querySelector("span").innerText = playfulPhrases[Math.floor(Math.random() * playfulPhrases.length)];
}

function forgiveAction(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    triggerBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 100);
    playHarpChord([523.25, 659.25, 783.99, 1046.50, 1318.51]);
    loadChapter(5);
}

function sendLoveReply(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    triggerBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 80);
    playHarpChord([659.25, 830.61, 987.77, 1318.51]);
    e.currentTarget.innerHTML = `<span>Smile Sent! 😊🤝</span>`;
    e.currentTarget.style.pointerEvents = 'none';
}

function handleBadgeTap(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    triggerBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 35);
    playHarpNote(880, 'sine', 0.4);
}

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 800);
});
